<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  text-align:center;
  font-family:sans-serif;
  padding:20px;
  background:white; /* CHANGED */
}

/* BUTTON */
button {
  padding:8px 16px;
  font-size:14px;
  cursor:pointer;
  margin-bottom:15px;
}

/* SPOTLIGHT */
.spotlight-container {
  perspective:1000px;
  width:200px;   /* smaller */
  height:280px;  /* thinner */
  margin:0 auto 15px auto;
  cursor:pointer;
}

.spotlight-inner {
  width:100%;
  height:100%;
  position:relative;
  transform-style:preserve-3d;
  transition:transform 0.6s;
}

.spotlight-inner.flipped {
  transform:rotateY(180deg);
}

.spotlight-inner .front,
.spotlight-inner .back {
  position:absolute;
  width:100%;
  height:100%;
  border-radius:10px;
  backface-visibility:hidden;
  background:black;

  background-size:contain;
  background-repeat:no-repeat;
  background-position:center;
}

.spotlight-inner .back {
  transform:rotateY(180deg);
}

/* MINI CARDS */
.row {
  display:flex;
  justify-content:center;
  gap:10px;
  margin-top:10px;
}

.card {
  width:90px;   /* smaller */
  height:126px; /* thinner */
  border-radius:6px;
  background:black;
  cursor:pointer;
  background-size:cover;
  background-position:center;

  transform:scaleX(1);
  opacity:1;
}

/* FAKE FLIP ANIMATION */
.card.revealing {
  transform:scaleX(0);
  opacity:0.5;
}

/* BLOG BUTTON */
#blogLink {
  pointer-events:none;
  opacity:0.5;
  display:inline-block;
}
</style>
</head>

<body>

<button onclick="openPack()">Open Pack</button>

<!-- SPOTLIGHT -->
<div class="spotlight-container" onclick="flipSpotlight()">
  <div id="spotlight" class="spotlight-inner">
    <div class="front"></div>
    <div class="back"></div>
  </div>
</div>

<!-- BLOG BUTTON -->
<a id="blogLink" href="#" target="_blank">
  <button>Read Blog</button>
</a>

<!-- ROW 1 -->
<div class="row">
  <div id="c1" class="card" onclick="selectCard(this)"></div>
  <div id="c2" class="card" onclick="selectCard(this)"></div>
  <div id="c3" class="card" onclick="selectCard(this)"></div>
</div>

<!-- ROW 2 -->
<div class="row">
  <div id="c4" class="card" onclick="selectCard(this)"></div>
  <div id="c5" class="card" onclick="selectCard(this)"></div>
  <div id="c6" class="card" onclick="selectCard(this)"></div>
</div>

<script>
const TOTAL_CARDS = 19;
let spotlightFlipped = false;

const blogLinks = [
"https://mitadmissions.org/blogs/entry/the-crimzone/",
"https://mitadmissions.org/blogs/entry/i-made-a-dress-out-of-target-bags/",
"https://mitadmissions.org/blogs/entry/setting-things-on-fire/",
"https://mitadmissions.org/blogs/entry/hokey-pokey/",
"https://mitadmissions.org/blogs/entry/king-of-boston-king-of-the-world/",
"https://mitadmissions.org/blogs/entry/picture-the-world/",
"https://mitadmissions.org/blogs/entry/summiting-mount-monadnock/",
"https://mitadmissions.org/blogs/entry/gently-down-the-stream/",
"https://mitadmissions.org/blogs/entry/the-pnr-mindset-vs-the-grindset-mindset/",
"https://mitadmissions.org/blogs/entry/halas-escape-from-groundhog-day/",
"https://mitadmissions.org/blogs/entry/1-fish-2-fish-a-lot-of-fish-and-a-snail/",
"https://mitadmissions.org/blogs/entry/trail-notes/",
"https://mitadmissions.org/blogs/entry/i-failed-the-swim-test/",
"https://mitadmissions.org/blogs/entry/clownazoo-part-2/",
"https://mitadmissions.org/blogs/entry/everything-i-made-this-year/",
"https://mitadmissions.org/blogs/entry/snip-snip/",
"https://mitadmissions.org/blogs/entry/an-infinite-nine-year-old/",
"https://mitadmissions.org/blogs/entry/we-have-the-winter-olympics-at-home/",
"https://mitadmissions.org/blogs/entry/the-periodic-table-of-mit/"
];

function openPack(){
  const cards = ["c1","c2","c3","c4","c5","c6"];

  const spotlight = document.getElementById("spotlight");
  const front = spotlight.querySelector(".front");
  const back = spotlight.querySelector(".back");

  front.style.backgroundImage = "";
  back.style.backgroundImage = "";
  front.style.backgroundColor = "black";
  back.style.backgroundColor = "black";

  spotlight.classList.remove("flipped");
  spotlightFlipped = false;

  const link = document.getElementById("blogLink");
  link.href = "#";
  link.style.pointerEvents = "none";
  link.style.opacity = "0.5";

  cards.forEach((id,i)=>{
    const el = document.getElementById(id);

    const num = Math.floor(Math.random() * TOTAL_CARDS) + 1;

    const frontPath = "Blog-TCG-Fronts/CampusTrade-FRONT-" + num + ".png";
    const backPath  = "Blog-TCG-Backs/CampusTrade-BACK-" + num + ".png";

    el.dataset.front = frontPath;
    el.dataset.back  = backPath;
    el.dataset.index = num - 1;

    el.style.backgroundImage = "";
    el.style.backgroundColor = "black";

    // FAKE FLIP
    setTimeout(()=>{
      el.classList.add("revealing");

      setTimeout(()=>{
        el.style.backgroundImage = "url('" + frontPath + "')";
        el.classList.remove("revealing");
      },150);

    }, i * 200);
  });
}

function selectCard(card){
  const spotlight = document.getElementById("spotlight");
  const front = spotlight.querySelector(".front");
  const back = spotlight.querySelector(".back");

  front.style.backgroundImage = "url('" + card.dataset.front + "')";
  back.style.backgroundImage  = "url('" + card.dataset.back + "')";
  front.style.backgroundColor = "transparent";
  back.style.backgroundColor  = "transparent";

  spotlight.classList.remove("flipped");
  spotlightFlipped = false;

  const link = document.getElementById("blogLink");
  link.href = blogLinks[card.dataset.index];
  link.style.pointerEvents = "auto";
  link.style.opacity = "1";
}

function flipSpotlight(){
  const spotlight = document.getElementById("spotlight");
  spotlight.classList.toggle("flipped");
  spotlightFlipped = !spotlightFlipped;
}
</script>

</body>
</html>
