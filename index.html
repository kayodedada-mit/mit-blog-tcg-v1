<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      text-align:center;
      font-family:sans-serif;
      padding:40px;
      background:#111;
    }

    button {
      margin-bottom:25px;
      padding:10px 20px;
      font-size:16px;
      cursor:pointer;
    }

    /* SPOTLIGHT */
    .spotlight-container {
      perspective: 1000px;
      width:250px;
      height:350px;
      margin:0 auto 25px auto;
      cursor:pointer;
    }

    .spotlight-inner {
      width:100%;
      height:100%;
      position:relative;
      transform-style: preserve-3d;
      transition: transform 0.6s;
    }

    .spotlight-inner.flipped {
      transform: rotateY(180deg);
    }

    .spotlight-inner .front,
    .spotlight-inner .back {
      position:absolute;
      width:100%;
      height:100%;
      border-radius:12px;
      backface-visibility: hidden;
      background:black;
    }

    .spotlight-inner .back {
      transform: rotateY(180deg);
    }

    /* MINI CARDS */
    .row {
      display:flex;
      justify-content:center;
      gap:15px;
      margin-top:15px;
    }

    .card {
      width:120px;
      height:168px;
      border-radius:8px;
      background:black;
      cursor:pointer;
      transition: transform 0.2s;
      background-size:cover;
      background-position:center;
    }

    .card:hover {
      transform: translateY(-5px);
    }
  </style>
</head>

<body>

<button onclick="openPack()">Open Pack</button>

<!-- SPOTLIGHT -->
<div class="spotlight-container" onclick="flipSpotlight()">
  <div id="spotlight" class="spotlight-inner">
    <div class="front"></div>
    <div class="back"></div>
  </div>
</div>

<!-- ROW 1 -->
<div class="row">
  <div id="c1" class="card" onclick="selectCard(this)"></div>
  <div id="c2" class="card" onclick="selectCard(this)"></div>
  <div id="c3" class="card" onclick="selectCard(this)"></div>
</div>

<!-- ROW 2 -->
<div class="row">
  <div id="c4" class="card" onclick="selectCard(this)"></div>
  <div id="c5" class="card" onclick="selectCard(this)"></div>
  <div id="c6" class="card" onclick="selectCard(this)"></div>
</div>

<script>
const TOTAL_CARDS = 19;
let spotlightFlipped = false;

function openPack(){
  const cards = ["c1","c2","c3","c4","c5","c6"];

  // Reset spotlight
  const spotlight = document.getElementById("spotlight");
  const front = spotlight.querySelector(".front");
  const back = spotlight.querySelector(".back");

  front.style.backgroundImage = "";
  back.style.backgroundImage = "";
  front.style.backgroundColor = "black";
  back.style.backgroundColor = "black";

  spotlight.classList.remove("flipped");
  spotlightFlipped = false;

  cards.forEach((id,i)=>{
    const el = document.getElementById(id);

    // random card
    const num = Math.floor(Math.random() * TOTAL_CARDS) + 1;

    const frontPath = "Blog-TCG-Fronts/CampusTrade-FRONT-" + num + ".png";
    const backPath  = "Blog-TCG-Backs/CampusTrade-BACK-" + num + ".png";

    // store data
    el.dataset.front = frontPath;
    el.dataset.back  = backPath;

    // reset
    el.style.backgroundImage = "";
    el.style.backgroundColor = "black";

    // stagger reveal
    setTimeout(()=>{
      el.style.backgroundImage = "url('" + frontPath + "')";
    }, i * 200);
  });
}

function selectCard(card){
  const spotlight = document.getElementById("spotlight");
  const front = spotlight.querySelector(".front");
  const back = spotlight.querySelector(".back");

  front.style.backgroundImage = "url('" + card.dataset.front + "')";
  back.style.backgroundImage  = "url('" + card.dataset.back + "')";
  front.style.backgroundColor = "transparent";
  back.style.backgroundColor  = "transparent";

  spotlight.classList.remove("flipped");
  spotlightFlipped = false;
}

function flipSpotlight(){
  const spotlight = document.getElementById("spotlight");
  spotlight.classList.toggle("flipped");
  spotlightFlipped = !spotlightFlipped;
}
</script>

</body>
</html>
